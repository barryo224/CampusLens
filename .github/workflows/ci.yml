name: CI

on:
  push:
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campuslens
          POSTGRES_PASSWORD: campuslens
          POSTGRES_DB: campuslens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campuslens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campuslens:campuslens@localhost:5432/campuslens_test
      TEST_DATABASE_URL: postgresql://campuslens:campuslens@localhost:5432/campuslens_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : la vérification des secrets lit aussi les anciens commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Client Prisma
        run: npm run db:generate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format (Prettier)
        run: npm run format:check
      - name: Tests backend et frontend, avec seuils de couverture (robots ≥ 90 %, API ≥ 80 %, calcul ≥ 90 %)
        run: npm run test:coverage
      - name: Aucun secret dans le dépôt ni dans son historique
        run: npm run verifier:secrets
      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: qualite-et-tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campuslens
          POSTGRES_PASSWORD: campuslens
          POSTGRES_DB: campuslens_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campuslens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campuslens:campuslens@localhost:5432/campuslens_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base de données (migrations et données de départ)
        run: |
          npm run db:generate
          npm run db:deploy -w backend
          npm run db:seed -w backend
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Tests de bout en bout — Chrome, Firefox et mobile (site de développement)
        run: npm run test:e2e
        env:
          CORS_ORIGIN: http://localhost:5173
      - name: Tests de bout en bout — site construit avec les en-têtes de sécurité de production (CSP, HSTS…)
        run: npm run test:e2e:prod -- --project=chromium --project=firefox --project=webkit --project=mobile --project=mobile-safari
        env:
          CORS_ORIGIN: http://localhost:4173
      - name: Lighthouse (performance ≥ 90, accessibilité ≥ 95) sur toutes les pages
        run: npm run lighthouse
        env:
          CORS_ORIGIN: http://localhost:4173
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: e2e/test-results
          retention-days: 7
